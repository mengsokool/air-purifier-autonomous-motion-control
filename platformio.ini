; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32s3_devkitc_n16r8
boards_dir = boards

[env]
framework = arduino
monitor_speed = 115200
monitor_filters =
	time
	colorize
build_flags =
	-Wall
	-Wextra
	-Wshadow
	-Wconversion
	-D PROJECT_VERSION=\"1.0.0\"

[env:esp32s3_devkitc_n16r8]
platform = espressif32
board = esp32_s3_devkitc_1_n16r8
upload_speed = 921600
lib_deps =
	madhephaestus/ESP32Servo@1.2.1
	duinoWitchery/hd44780@^1.3.2
	adafruit/Adafruit INA219@^1.2.3
build_flags =
	${env.build_flags}
	; Serial test uses the USB-to-UART bridge (/dev/tty.usbserial-*).
	; Native USB CDC is intentionally disabled for this diagnostic firmware.
	-D ARDUINO_USB_CDC_ON_BOOT=0

[env:native]
platform = native
framework =
test_framework = unity
test_build_src = yes
build_src_filter =
	+<AdaptiveAvoidance.cpp>
	+<AirQualityPolicy.cpp>
	+<BatterySocModel.cpp>
	+<CorridorCommitment.cpp>
	+<DifferentialSteering.cpp>
	+<GapPlanner.cpp>
	+<RadarFilter.cpp>
	+<RadarMotionVerifier.cpp>
	+<StablePathPlanner.cpp>
build_flags =
	-std=c++17
	-Wall
	-Wextra
	-Wshadow
	-Wconversion
	-I include
