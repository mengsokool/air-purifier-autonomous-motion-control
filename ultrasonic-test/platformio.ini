[platformio]
default_envs = esp32s3_devkitc_n16r8
boards_dir = ../boards

[env:esp32s3_devkitc_n16r8]
platform = espressif32
board = esp32_s3_devkitc_1_n16r8
framework = arduino
monitor_speed = 115200
lib_deps =
	madhephaestus/ESP32Servo@1.2.1
build_flags =
	-I ../include
	-D ARDUINO_USB_CDC_ON_BOOT=0
